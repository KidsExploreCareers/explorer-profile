<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Create a private Explorer Profile and discover interests, strengths, and ways of learning."
  >

  <title>Explorer Profile | Kids Explore Careers</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="app-shell">

    <header class="hero">
      <h1 class="brand-name" aria-label="Kids Explore Careers">
        <span class="brand-kids">Kids</span>
        <span class="brand-explore">Explore</span>
        <span class="brand-careers">Careers</span>
      </h1>

      <p class="hero-subtitle">Explorer Profile</p>
    </header>

    <section
      id="app-card"
      class="card"
      aria-live="polite"
    ></section>

    <footer class="app-footer">
      <p>Kids Explore Careers</p>

      <p class="small-text">
        Your Explorer Profile answers stay in this browser tab and are not
        submitted to Kids Explore Careers.
      </p>
    </footer>

  </main>

  <noscript>
    <div class="noscript-message">
      JavaScript is required to use the Explorer Profile.
    </div>
  </noscript>

  <script src="questions.js"></script>
  <script src="narratives.js"></script>
  <script src="app.js"></script>
</body>
</html>
